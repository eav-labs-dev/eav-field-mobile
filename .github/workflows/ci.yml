name: CI

on:
  pull_request:
  push:
    branches: [main, develop, dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Validate Expo and EAS configuration
        run: npm run config:check > /dev/null
      - name: Test
        run: npm run test
